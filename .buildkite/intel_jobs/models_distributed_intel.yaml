group: Models - Distributed Intel
depends_on: 
  - image-build-xpu
steps:
- label: ":intel: (BMG) Distributed Model Tests"
  key: distributed-model-tests-2-gpus
  timeout_in_minutes: 65
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/model_executor/model_loader/sharded_state_loader.py
  - vllm/model_executor/models/
  - vllm/models/deepseek_v4/
  - vllm/envs.py
  - vllm/models/deepseek_v41/compressor.py
  - vllm/models/deepseek_v41/common/ops/fused_compress_quant_cache.py
  - vllm/v1/worker/gpu/pcp_manager.py
  - vllm/v1/attention/backends/mla/sparse_swa.py
  - tests/models/test_deepseek_v4_pcp.py
  - tests/model_executor/model_loader/test_sharded_state_loader.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s
      model_executor/model_loader/test_sharded_state_loader.py
      models/test_deepseek_v4_pcp.py
      -m "not slow_test" -k "not pcp4"'

- label: ":intel: (BMG) DeepSeek V4 PCP4"
  key: distributed-model-tests-pcp-4-gpus
  timeout_in_minutes: 65
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 4+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/models/deepseek_v4/
  - vllm/envs.py
  - vllm/models/deepseek_v41/compressor.py
  - vllm/models/deepseek_v41/common/ops/fused_compress_quant_cache.py
  - vllm/v1/worker/gpu/pcp_manager.py
  - vllm/v1/attention/backends/mla/
  - tests/models/test_deepseek_v4_pcp.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s
      models/test_deepseek_v4_pcp.py
      -k pcp4'
